<style>
  :root{
    --bg:#202024; --card:#2a2a2f; --text:#e8e5df; --muted:#9a978f;
    --accent:#c47046; --accent-soft:rgba(196,112,70,.14);
    --accent2:#7ba8b8; --accent2-soft:rgba(123,168,184,.14);
    --border:rgba(232,229,223,.12);
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  [data-theme="light"]{
    --bg:#f4f2ee; --card:#ffffff; --text:#1c1a17; --muted:#6b6760;
    --accent-soft:rgba(196,112,70,.12); --accent2-soft:rgba(123,168,184,.16);
    --border:rgba(28,26,23,.10); --shadow:0 6px 24px rgba(28,26,23,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Sora','Cairo',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; line-height:1.5;
    transition:background .3s,color .3s;
  }
  .app{max-width:880px;margin:0 auto;padding:0 16px 120px}
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:14px 0; margin:0 -16px; padding-left:16px; padding-right:16px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,var(--accent),#e0926b);
    display:grid;place-items:center;color:#202024;font-weight:700;font-size:20px;
    box-shadow:0 4px 14px rgba(196,112,70,.35);
  }
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .icon-btn{
    height:40px;min-width:40px;padding:0 10px;border-radius:12px;flex:none;cursor:pointer;
    background:var(--card); border:1px solid var(--border); color:var(--text);
    display:grid;place-items:center; transition:transform .15s, border-color .2s;
    font-family:inherit;font-weight:700;font-size:13px;
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn:hover{border-color:var(--accent)}
  .icon-btn svg{width:20px;height:20px}
  #backBtn{display:none}
  .search-wrap{position:relative;margin:20px 0 6px}
  .search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
  #search{
    width:100%; padding:14px 14px 14px 44px; border-radius:14px;
    background:var(--card); border:1px solid var(--border); color:var(--text);
    font-family:inherit; font-size:15px; outline:none; transition:border-color .2s;
  }
  #search:focus{border-color:var(--accent)}
  .cat-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:22px 4px 10px;font-weight:600}
  .tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .tool-card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:18px 14px; cursor:pointer; text-align:inherit; font-family:inherit; color:var(--text);
    transition:transform .18s, border-color .2s, box-shadow .2s;
  }
  .tool-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
  .tool-card .ticon{
    width:44px;height:44px;border-radius:13px;margin-bottom:12px;
    background:var(--accent-soft); color:var(--accent); display:grid;place-items:center;
  }
  .tool-card .ticon svg{width:22px;height:22px}
  .tool-card h3{margin:0;font-size:14.5px;font-weight:600}
  .tool-card p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
  #toolView{display:none;animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .tool-head{margin:22px 0 18px}
  .tool-head h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.4px}
  .tool-head p{margin:0;color:var(--muted);font-size:13px}
  .panel{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:20px; margin-bottom:14px;
  }
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  label:first-child{margin-top:0}
  input[type=number],input[type=text],input[type=date],input[type=password],select,textarea{
    width:100%; padding:13px 14px; border-radius:12px; font-family:inherit; font-size:15px;
    background:var(--bg); border:1px solid var(--border); color:var(--text); outline:none;
    transition:border-color .2s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:110px;line-height:1.55}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:520px){.row3{grid-template-columns:1fr 1fr}}
  .btn{
    padding:13px 18px; border-radius:12px; font-family:inherit; font-size:14.5px; font-weight:600;
    cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text);
    transition:transform .12s, opacity .2s; display:inline-flex; align-items:center; gap:8px; justify-content:center;
  }
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
  .btn.primary:hover{background:color-mix(in srgb, var(--accent) 22%, transparent)}
  .btn svg{width:17px;height:17px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .result{
    background:var(--accent2-soft); border:1px solid color-mix(in srgb, var(--accent2) 40%, transparent);
    border-radius:14px; padding:16px 18px; margin-top:16px; display:none;
  }
  .result.show{display:block;animation:fadeUp .25s ease}
  .result .big{font-size:26px;font-weight:700;letter-spacing:-.3px;color:var(--text);word-break:break-all}
  .result .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .pill{
    display:inline-block; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600;
    background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent); margin-top:8px;
  }
  .calc-display{
    background:var(--bg); border:1px solid var(--border); border-radius:14px;
    padding:18px 16px; text-align:right; font-size:30px; font-weight:600;
    min-height:72px; word-break:break-all; margin-bottom:14px; font-variant-numeric:tabular-nums; direction:ltr;
  }
  .calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .calc-keys button{
    padding:16px 0; border-radius:12px; font-family:inherit; font-size:18px; font-weight:600;
    background:var(--bg); border:1px solid var(--border); color:var(--text); cursor:pointer;
    transition:transform .1s, background .15s;
  }
  .calc-keys button:active{transform:scale(.94)}
  .calc-keys button.op{color:var(--accent)}
  .calc-keys button.eq{background:var(--accent);border-color:var(--accent);color:#202024}
  .calc-keys button.fn{color:var(--accent2)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--bg);padding:5px;border-radius:12px;border:1px solid var(--border)}
  .tabs button{flex:1;padding:10px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;border-radius:9px;cursor:pointer}
  .tabs button.active{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .chrono{font-size:52px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:14px 0;direction:ltr}
  .chrono small{font-size:26px;color:var(--muted)}
  .todo-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
  .todo-item:last-child{border-bottom:none}
  .todo-item.done span{text-decoration:line-through;color:var(--muted)}
  .todo-item span{flex:1;font-size:14.5px;word-break:break-word}
  .check{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);cursor:pointer;flex:none;display:grid;place-items:center;color:transparent}
  .todo-item.done .check{background:var(--accent);border-color:var(--accent);color:#202024}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px}
  .del svg{width:18px;height:18px}
  .del:hover{color:#e05555}
  .swatch-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .swatch{height:56px;border-radius:10px;border:1px solid var(--border);cursor:pointer;position:relative}
  .swatch span{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:600;background:rgba(0,0,0,.35);color:#fff;padding:2px 0;border-radius:0 0 9px 9px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted)}
  .checkline{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px;cursor:pointer}
  .checkline input{width:18px;height:18px;accent-color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  #qrOut{text-align:center;margin-top:16px}
  .footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:36px;padding-top:20px;border-top:1px solid var(--border)}
  #admob-banner{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;min-height:50px;background:var(--card);border-top:1px solid var(--border)}
  .toast{
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:all .3s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  [dir="rtl"] .search-wrap svg{left:auto;right:14px}
  [dir="rtl"] #search{padding:14px 44px 14px 14px}
  [dir="rtl"] .result .big{direction:ltr;unicode-bidi:embed}
  [dir="rtl"] .stat b{direction:ltr;unicode-bidi:embed}
  [dir="rtl"] .calc-keys{direction:ltr}
</style>
</head>

  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1800);
}
function copyText(txt){
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast(T('copied'));},function(){toast(T('copyFail'));});}
  else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(T('copied'));}catch(e){toast(T('copyFail'));}document.body.removeChild(ta);}
}

reg({id:'calc',cat:'Calculate',icon:'calc',
init:function(c){
  c.innerHTML='<div class="panel"><div class="calc-display" id="calcDisp">0</div>'+
  '<div class="calc-keys">'+
  '<button class="fn" data-k="C">C</button><button class="fn" data-k="back">⌫</button><button class="fn" data-k="%">%</button><button class="op" data-k="/">÷</button>'+
  '<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>'+
  '<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>'+
  '<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>'+
  '<button data-k="0">0</button><button data-k=".">.</button><button class="op" data-k="(">(</button><button class="eq" data-k="=">=</button>'+
  '</div></div>';
  var disp=$('#calcDisp',c), expr='';
  function render(){disp.textContent=expr||'0';}
  function compute(){
    try{
      var e=expr.replace(/%/g,'/100');
      if(!/^[0-9+\-*/().\s]+$/.test(e)) return T('calcError');
      var v=Function('"use strict";return ('+e+')')();
      if(typeof v!=='number'||!isFinite(v)) return T('calcError');
      return String(Math.round(v*1e10)/1e10);
    }catch(err){return T('calcError');}
  }
  c.querySelectorAll('.calc-keys button').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-k');
      if(k==='C'){expr='';}
      else if(k==='back'){expr=expr.slice(0,-1);}
      else if(k==='='){expr=compute();}
      else{ if(expr===T('calcError')) expr=''; expr+=k; }
      render();
    });
  });
}});

  Object.keys(UNITS).forEach(function(k){cat.appendChild(el('<option value="'+k+'">'+k+'</option>'));});

    from.innerHTML='';to.innerHTML='';
    Object.keys(UNITS[cat.value]).forEach(function(u){
      from.appendChild(el('<option value="'+u+'">'+u.toUpperCase()+'</option>'));
      to.appendChild(el('<option value="'+u+'">'+u.toUpperCase()+'</option>'));

  }

  [from,to,val].forEach(function(e){e.addEventListener('input',convert);});

    var P=parseFloat($('#lP',c).value), apy=parseFloat($('#lR',c).value), y=parseInt($('#lY',c).value);

  }
  c.querySelectorAll('input').forEach(function(i){i.addEventListener('input',calc);});
  calc();
}});

reg({id:'bmi',cat:'Health',icon:'heart',
init:function(c){
  c.innerHTML='<div class="panel"><div class="row"><div><label>'+T('height')+'</label><input type="number" id="bH" value="170"></div>'+
  '<div><label>'+T('weight')+'</label><input type="number" id="bW" value="70" step="any"></div></div>'+
  '<div class="result" id="bRes"><div class="big"></div><div class="sub"></div><div class="pill" id="bPill"></div></div></div>';
  function calc(){
    var h=parseFloat($('#bH',c).value), w=parseFloat($('#bW',c).value);
    if(!h||!w) return;
    var bmi=w/Math.pow(h/100,2);
    var cat = bmi<18.5?T('bmiUnder'): bmi<25?T('bmiNormal'): bmi<30?T('bmiOver'):T('bmiObese');
    showResult($('#bRes',c), bmi.toFixed(1), T('bmiUnit'));
    $('#bPill',c).textContent=cat;
  }
  c.querySelectorAll('input').forEach(function(i){i.addEventListener('input',calc);});
  calc();
}});

reg({id:'age',cat:'DateTime',icon:'cake',
init:function(c){
  c.innerHTML='<div class="panel"><label>'+T('dob')+'</label><input type="date" id="aDob">'+
  '<div class="result" id="aRes"><div class="big"></div><div class="sub"></div></div>'+
  '<div class="stat-grid"><div class="stat"><b id="aMonths">–</b><span>'+T('monthsStat')+'</span></div>'+
  '<div class="stat"><b id="aWeeks">–</b><span>'+T('weeksStat')+'</span></div>'+
  '<div class="stat"><b id="aDays">–</b><span>'+T('daysStat')+'</span></div></div></div>';
  function calc(){
    var dob=new Date($('#aDob',c).value);
    if(isNaN(dob)) return;
    var now=new Date();
    var y=now.getFullYear()-dob.getFullYear(), m=now.getMonth()-dob.getMonth(), d=now.getDate()-dob.getDate();
    if(d<0){m--; d+=new Date(now.getFullYear(),now.getMonth(),0).getDate();}
    if(m<0){y--; m+=12;}
    var days=Math.floor((now-dob)/86400000);
    showResult($('#aRes',c), y+' '+T('yearsOld'), T('ageSub').replace('{m}',m).replace('{d}',d));
    $('#aMonths',c).textContent=y*12+m;
    $('#aWeeks',c).textContent=Math.floor(days/7).toLocaleString();
    $('#aDays',c).textContent=days.toLocaleString();
  }
  $('#aDob',c).addEventListener('input',calc);
}});

reg({id:'datediff',cat:'DateTime',icon:'calendar',
init:function(c){
  c.innerHTML='<div class="panel"><div class="row"><div><label>'+T('fromL')+'</label><input type="date" id="d1"></div>'+
  '<div><label>'+T('toL')+'</label><input type="date" id="d2"></div></div>'+
  '<div class="result" id="dRes"><div class="big"></div><div class="sub"></div></div></div>';
  function calc(){
    var a=new Date($('#d1',c).value), b=new Date($('#d2',c).value);
    if(isNaN(a)||isNaN(b)) return;
    var days=Math.round((b-a)/86400000);
    showResult($('#dRes',c), Math.abs(days).toLocaleString()+' '+T('daysStat'), T('weeksSub').replace('{w}',Math.abs(Math.floor(days/7))).replace('{mo}',Math.abs(Math.round(days/30.44))));
  }
  c.querySelectorAll('input').forEach(function(i){i.addEventListener('input',calc);});
}});

reg({id:'pass',cat:'Security',icon:'key',
init:function(c){
  c.innerHTML='<div class="panel"><label>'+T('length')+': <span id="plLen">16</span></label><input type="range" id="pLen" min="6" max="64" value="16">'+
  '<div class="checkline"><input type="checkbox" id="pU" checked> '+T('pwdUpper')+'</div>'+
  '<div class="checkline"><input type="checkbox" id="pL" checked> '+T('pwdLower')+'</div>'+
  '<div class="checkline"><input type="checkbox" id="pN" checked> '+T('pwdNum')+'</div>'+
  '<div class="checkline"><input type="checkbox" id="pS" checked> '+T('pwdSym')+'</div>'+
  '<div class="result show" id="pRes"><div class="big" id="pOut" style="font-family:monospace;word-break:break-all;direction:ltr"></div></div>'+
  '<div class="btn-row"><button class="btn primary" id="pGen">'+svgIcon('refresh',16)+' '+T('generate')+'</button>'+
  '<button class="btn" id="pCopy">'+svgIcon('copy',16)+' '+T('copy')+'</button></div></div>';
  var sets={U:'ABCDEFGHJKLMNPQRSTUVWXYZ',L:'abcdefghijkmnpqrstuvwxyz',N:'23456789',S:'!@#$%^&*()-_=+[]{};:,.<>?'};
  function gen(){
    var len=parseInt($('#pLen',c).value), pool='';
    ['U','L','N','S'].forEach(function(k){if($('#p'+k,c).checked) pool+=sets[k];});
    if(!pool){$('#pOut',c).textContent=T('selectOne');return;}
    var out='';
    var arr=new Uint32Array(len);
    if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(arr); for(var i=0;i<len;i++) out+=pool[arr[i]%pool.length];}
    else{for(var j=0;j<len;j++) out+=pool[Math.floor(Math.random()*pool.length)];}
    $('#pOut',c).textContent=out;
  }
  $('#pLen',c).addEventListener('input',function(){$('#plLen',c).textContent=this.value;gen();});
  c.querySelectorAll('input[type=checkbox]').forEach(function(i){i.addEventListener('change',gen);});
  $('#pGen',c).addEventListener('click',gen);
  $('#pCopy',c).addEventListener('click',function(){copyText($('#pOut',c).textContent);});
  gen();
}});

reg({id:'qr',cat:'Create',icon:'qr',
init:function(c){
  c.innerHTML='<div class="panel"><label>Text / URL</label><input type="text" id="qText" placeholder="https://" value="https://">'+
  '<div class="btn-row"><button class="btn primary" id="qGen">'+T('genQR')+'</button>'+
  '<button class="btn" id="qDl">'+T('dlPNG')+'</button></div>'+
  '<div id="qrOut"></div></div>';
  var out=$('#qrOut',c), lastSvg='';
  function gen(){
    var txt=$('#qText',c).value.trim();
    if(!txt){toast(T('enterText'));return;}
    if(typeof qrcode==='undefined'){out.innerHTML='<p class="empty">'+T('qrLoading')+'</p>';return;}
    try{
      var qr=qrcode(0,'M'); qr.addData(txt); qr.make();
      lastSvg=qr.createSvgTag(8,4);
      out.innerHTML='<div style="display:inline-block;background:#fff;padding:14px;border-radius:12px;line-height:0">'+lastSvg+'</div>';
      var svgEl=out.querySelector('svg');
      if(svgEl){svgEl.style.maxWidth='200px';svgEl.style.height='auto';}
    }catch(e){out.innerHTML='<p class="empty">'+T('qrFail')+'</p>';lastSvg='';}
  }
  $('#qGen',c).addEventListener('click',gen);
  $('#qDl',c).addEventListener('click',function(){
    if(!lastSvg){toast(T('genFirst'));return;}
    try{
      var blob=new Blob([lastSvg],{type:'image/svg+xml'});
      var url=URL.createObjectURL(blob);
      var img=new Image();
      img.onload=function(){
        var cv=document.createElement('canvas');cv.width=512;cv.height=512;
        var ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,512,512);
        ctx.drawImage(img,16,16,480,480);
        URL.revokeObjectURL(url);
        var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='qrcode.png';
        document.body.appendChild(a);a.click();document.body.removeChild(a);
      };
      img.onerror=function(){URL.revokeObjectURL(url);toast(T('dlFail'));};
      img.src=url;
    }catch(e){toast(T('dlFail'));}
  });
}});

reg({id:'color',cat:'Create',icon:'palette',
init:function(c){
  c.innerHTML='<div class="panel"><label>'+T('pickColor')+'</label><div class="row"><div><input type="color" id="cPick" value="#c47046" style="height:52px;padding:4px;cursor:pointer"></div>'+
  '<div><input type="text" id="cHex" value="#c47046"></div></div>'+
  '<div class="stat-grid"><div class="stat"><b id="cRgb" style="font-size:14px">–</b><span>RGB</span></div>'+
  '<div class="stat"><b id="cHsl" style="font-size:14px">–</b><span>HSL</span></div></div>'+
  '<div class="swatch-row" id="cSwatches"></div></div>';
  function hexToRgb(h){h=h.replace('#','');return {r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};}
  function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h,s,l=(mx+mn)/2;
    if(mx===mn){h=s=0;}else{var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}
    return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
  function shade(rgb,amt){return 'rgb('+Math.max(0,Math.min(255,rgb.r+amt))+','+Math.max(0,Math.min(255,rgb.g+amt))+','+Math.max(0,Math.min(255,rgb.b+amt))+')';}
  function update(){
    var hex=$('#cHex',c).value;
    if(!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
    $('#cPick',c).value=hex;
    var rgb=hexToRgb(hex), hsl=rgbToHsl(rgb.r,rgb.g,rgb.b);
    $('#cRgb',c).textContent=rgb.r+', '+rgb.g+', '+rgb.b;
    $('#cHsl',c).textContent=hsl.h+'°, '+hsl.s+'%, '+hsl.l+'%';
    var sw=$('#cSwatches',c);sw.innerHTML='';
    [-60,-30,0,30,60].forEach(function(amt){
      var col=shade(rgb,amt);
      var d=el('<div class="swatch" style="background:'+col+'"><span>'+col.replace('rgb(','').replace(')','')+'</span></div>');
      d.addEventListener('click',function(){copyText(col);});
      sw.appendChild(d);
    });
  }
  $('#cPick',c).addEventListener('input',function(){$('#cHex',c).value=this.value;update();});
  $('#cHex',c).addEventListener('input',update);
  update();
}});

reg({id:'todo',cat:'Productivity',icon:'check',
init:function(c){
  c.innerHTML='<div class="panel"><div style="display:flex;gap:10px"><input type="text" id="tdIn" placeholder="'+T('addTaskPh')+'" style="flex:1">'+
  '<button class="btn primary" id="tdAdd" style="padding:0 16px">'+svgIcon('plus',18)+'</button></div>'+
  '<div id="tdList" style="margin-top:10px"></div></div>';
  var list=$('#tdList',c), inp=$('#tdIn',c), items=[];
  try{items=JSON.parse(localStorage.getItem('pt-todo')||'[]');}catch(e){items=[];}
  function save(){try{localStorage.setItem('pt-todo',JSON.stringify(items));}catch(e){}}
  function render(){
    list.innerHTML='';
    if(!items.length){list.innerHTML='<p class="empty">'+T('noTasks')+'</p>';return;}
    items.forEach(function(it,i){
      var row=el('<div class="todo-item'+(it.done?' done':'')+'"><div class="check">'+svgIcon('checkmark',14)+'</div><span></span><button class="del">'+svgIcon('trash',18)+'</button></div>');
      row.querySelector('span').textContent=it.text;
      row.querySelector('.check').addEventListener('click',function(){items[i].done=!items[i].done;save();render();});
      row.querySelector('.del').addEventListener('click',function(){items.splice(i,1);save();render();});
      list.appendChild(row);
    });
  }
  function add(){
    var t=inp.value.trim(); if(!t) return;
    items.unshift({text:t,done:false}); inp.value=''; save(); render();
  }
  $('#tdAdd',c).addEventListener('click',add);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')add();});
  render();
}});

reg({id:'timer',cat:'DateTime',icon:'timer',
init:function(c){
  c.innerHTML='<div class="panel"><div class="tabs"><button class="active" data-tab="sw">'+T('stopwatch')+'</button><button data-tab="tm">'+T('timerTab')+'</button></div>'+
  '<div class="chrono" id="chDisp">00:00<small>.00</small></div>'+
  '<div id="tmSet" style="display:none"><div class="row3"><div><label>'+T('minutes')+'</label><input type="number" id="tmMin" value="5" min="0"></div>'+
  '<div><label>'+T('seconds')+'</label><input type="number" id="tmSec" value="0" min="0" max="59"></div><div></div></div></div>'+
  '<div class="btn-row" style="justify-content:center"><button class="btn primary" id="chStart">'+svgIcon('play',16)+' '+T('start')+'</button>'+
  '<button class="btn" id="chReset">'+T('reset')+'</button></div></div>';
  var disp=$('#chDisp',c), startBtn=$('#chStart',c), resetBtn=$('#chReset',c);
  var tmSet=$('#tmSet',c), tab='sw', raf=null, running=false, startTs=0, acc=0, endTs=0;
  function fmt(ms){
    var neg=ms<0; ms=Math.abs(ms);
    var h=Math.floor(ms/3600000), m=Math.floor(ms/60000)%60, s=Math.floor(ms/1000)%60, cs=Math.floor(ms/10)%100;
    var p=function(n){return (n<10?'0':'')+n;};
    var str=(h>0?p(h)+':':'')+p(m)+':'+p(s)+'<small>.'+p(cs)+'</small>';
    return neg?'-'+str:str;
  }
  function stop(){if(raf){cancelAnimationFrame(raf);raf=null;}running=false;startBtn.innerHTML=svgIcon('play',16)+' '+T('start');}
  function beep(){try{var ctx=new (window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator();var g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1);o.start();o.stop(ctx.currentTime+1);}catch(e){}}
  function loop(){
    var now=Date.now(), el;
    if(tab==='sw'){el=acc+(running?now-startTs:0);}
    else{el=endTs-now; if(el<=0){el=0;stop();beep();toast(T('timeUp'));}}
    disp.innerHTML=fmt(el);
    raf=requestAnimationFrame(loop);
  }
  function startLoop(){if(!raf)raf=requestAnimationFrame(loop);}
  startBtn.addEventListener('click',function(){
    if(running){acc+=(Date.now()-startTs);stop();return;}
    running=true; startTs=Date.now();
    if(tab==='tm'){
      var min=parseInt($('#tmMin',c).value)||0, sec=parseInt($('#tmSec',c).value)||0;
      if(acc===0) endTs=startTs+(min*60+sec)*1000; else endTs=startTs+acc;
    }
    startBtn.innerHTML=svgIcon('pause',16)+' '+T('pause');
    startLoop();
  });
  resetBtn.addEventListener('click',function(){stop();acc=0;disp.innerHTML=fmt(0);});
  c.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click',function(){
      c.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); tab=b.getAttribute('data-tab');
      tmSet.style.display=tab==='tm'?'block':'none';
      stop();acc=0;disp.innerHTML=fmt(0);
    });
  });
  disp.innerHTML=fmt(0);
}});

reg({id:'text',cat:'Productivity',icon:'type',
init:function(c){
  c.innerHTML='<div class="panel"><textarea id="txArea" placeholder="'+T('textPh')+'"></textarea>'+
  '<div class="stat-grid"><div class="stat"><b id="txChars">0</b><span>'+T('characters')+'</span></div>'+
  '<div class="stat"><b id="txWords">0</b><span>'+T('words')+'</span></div>'+
  '<div class="stat"><b id="txLines">0</b><span>'+T('lines')+'</span></div></div>'+
  '<div class="btn-row"><button class="btn" data-fn="upper">'+T('upper')+'</button><button class="btn" data-fn="lower">'+T('lower')+'</button>'+
  '<button class="btn" data-fn="title">'+T('titleCase')+'</button><button class="btn" data-fn="reverse">'+T('reverse')+'</button>'+
  '<button class="btn" data-fn="clean">'+T('clean')+'</button><button class="btn" data-fn="copy">'+svgIcon('copy',16)+' '+T('copy')+'</button></div></div>';
  var ta=$('#txArea',c);
  function stats(){
    var t=ta.value;
    $('#txChars',c).textContent=t.length;
    $('#txWords',c).textContent=t.trim()?t.trim().split(/\s+/).length:0;
    $('#txLines',c).textContent=t?t.split('\n').length:0;
  }

  c.querySelectorAll('[data-fn]').forEach(function(b){

var homeView=$('#homeView'), toolView=$('#toolView'), toolBody=$('#toolBody');
var toolTitle=$('#toolTitle'), toolDesc=$('#toolDesc');
var gridWrap=$('#toolGridWrap'), search=$('#search');
var currentView='home';

function renderHome(filter){
  gridWrap.innerHTML='';
  var cats={};
  TOOLS.forEach(function(t){
    var hay=(T('n_'+t.id)+' '+T('cat_'+t.cat)+' '+T('d_'+t.id)).toLowerCase();
    if(filter && hay.indexOf(filter.toLowerCase())===-1) return;
    (cats[t.cat]=cats[t.cat]||[]).push(t);
  });
  if(!Object.keys(cats).length){gridWrap.innerHTML='<p class="empty">'+T('noMatch')+' “'+filter+'”.</p>';return;}
  Object.keys(cats).sort().forEach(function(cat){
    var lab=el('<div class="cat-label">'+T('cat_'+cat)+'</div>'); gridWrap.appendChild(lab);
    var grid=el('<div class="tool-grid"></div>');
    cats[cat].forEach(function(t){
      var card=el('<button class="tool-card"><div class="ticon">'+svgIcon(t.icon,22)+'</div><h3>'+T('n_'+t.id)+'</h3><p>'+T('d_'+t.id).split('.')[0]+'.</p></button>');
      card.addEventListener('click',function(){go(t.id);});
      grid.appendChild(card);
    });
    gridWrap.appendChild(grid);
  });
}
search.addEventListener('input',function(){renderHome(this.value);});

function openTool(t, skipAd){
  if(!skipAd) AdmobHooks.maybeInterstitial();
  homeView.style.display='none'; toolView.style.display='block';
  backBtn.style.display='grid';
  toolTitle.textContent=T('n_'+t.id); toolDesc.textContent=T('d_'+t.id);
  toolBody.innerHTML='';
  t.init(toolBody);
  window.scrollTo(0,0);
}
function go(id){
  if(id==='home'){
    currentView='home';
    homeView.style.display='block'; toolView.style.display='none';
    backBtn.style.display='none';
    window.scrollTo(0,0); return;
  }
  var t=TOOLS.find(function(x){return x.id===id;});
  if(!t) return;
  currentView=id;
  openTool(t,false);
}
backBtn.addEventListener('click',function(){go('home');});

renderHome();

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
